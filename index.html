<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e13">
<title>Muse Watch — 3D Viewer</title>
<style>
  :root{
    --bg:#0b0e13; --panel:rgba(18,22,29,.72); --panel-border:rgba(255,255,255,.09);
    --text:#f2f5f8; --muted:#9aa7b5; --accent:#39c2d7; --accent2:#7ee0c2;
    --chip:rgba(255,255,255,.06); --radius:18px;
    --sat: env(safe-area-inset-top,0px); --sab: env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0; font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif; background:var(--bg); color:var(--text); overflow:hidden}
  #view{position:fixed; inset:0}
  #view canvas{display:block; touch-action:none}
  .vignette{position:fixed; inset:0; pointer-events:none; background:radial-gradient(120% 90% at 50% 30%, transparent 55%, rgba(0,0,0,.5) 100%)}

  /* brand */
  .brand{position:fixed; top:calc(12px + var(--sat)); left:12px; display:flex; align-items:center; gap:10px; padding:9px 14px 9px 10px;
    background:var(--panel); border:1px solid var(--panel-border); border-radius:999px; backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); z-index:5}
  .brand .dot{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2)); display:grid;place-items:center; font-size:16px}
  .brand b{font-size:14px; letter-spacing:.02em}
  .brand small{display:block; font-size:10.5px; color:var(--muted); font-weight:500}

  /* side tools */
  .tools{position:fixed; right:12px; top:50%; transform:translateY(-50%); display:flex; flex-direction:column; gap:8px; z-index:5}
  .tools button{width:46px;height:46px;border-radius:14px;border:1px solid var(--panel-border); background:var(--panel); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    color:var(--text); cursor:pointer; display:grid; place-items:center; padding:0}
  .tools button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .tools button.active{background:var(--accent); border-color:var(--accent); color:#06222a}
  .tools button:active{transform:scale(.94)}

  /* bottom sheet */
  .sheet{position:fixed; left:0; right:0; bottom:0; z-index:6; padding:10px 12px calc(10px + var(--sab));
    background:linear-gradient(to top, rgba(8,10,14,.92) 55%, transparent); }
  .info{max-width:760px; margin:0 auto 10px; background:var(--panel); border:1px solid var(--panel-border); border-radius:var(--radius);
    backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); padding:12px 16px}
  .info h2{margin:0 0 3px; font-size:15px}
  .info p{margin:0; font-size:12.5px; line-height:1.55; color:var(--muted)}
  .chips{display:flex; gap:8px; overflow-x:auto; padding:2px 2px 4px; max-width:760px; margin:0 auto; scrollbar-width:none; -webkit-overflow-scrolling:touch}
  .chips::-webkit-scrollbar{display:none}
  .chips button{flex:0 0 auto; min-height:44px; padding:10px 16px; border-radius:999px; border:1px solid var(--panel-border);
    background:var(--chip); color:var(--text); font-size:13.5px; font-weight:600; cursor:pointer; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px)}
  .chips button.active{background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#06222a; border-color:transparent}
  .chips button:active{transform:scale(.96)}

  /* loading */
  #loading{position:fixed; inset:0; display:grid; place-items:center; background:rgba(8,10,14,.45); z-index:9; transition:opacity .3s}
  #loading.hide{opacity:0; pointer-events:none}
  .spin{width:44px;height:44px;border-radius:50%;border:3px solid rgba(255,255,255,.15);border-top-color:var(--accent); animation:sp 0.8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .hint{position:fixed; top:calc(12px + var(--sat)); right:12px; z-index:4; font-size:11px; color:var(--muted); background:var(--panel);
    border:1px solid var(--panel-border); padding:7px 11px; border-radius:999px; backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px)}
  @media (max-width:640px){ .hint{display:none} .tools{top:auto; bottom:190px; transform:none} }
</style>
<script type="importmap">
{ "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/addons/"
} }
</script>
</head>
<body>
<div id="view"></div>
<div class="vignette"></div>

<div class="brand">
  <div class="dot">🧼</div>
  <div><b>MUSE WATCH</b><small>Pixel Watch 4 Pendant + Dock</small></div>
</div>
<div class="hint">ドラッグ: 回転 / ピンチ・ホイール: ズーム</div>

<div class="tools">
  <button id="spinBtn" title="自動回転" aria-label="自動回転"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.3"/><path d="M21 3v6h-6"/></svg></button>
  <button id="wireBtn" title="ワイヤーフレーム" aria-label="ワイヤーフレーム"><svg viewBox="0 0 24 24"><path d="M12 2 3 7v10l9 5 9-5V7l-9-5z"/><path d="M3 7l9 5 9-5"/><path d="M12 12v10"/></svg></button>
  <button id="frontBtn" title="正面" aria-label="正面"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.5"/></svg></button>
  <button id="topBtn" title="上面" aria-label="上面"><svg viewBox="0 0 24 24"><path d="M12 3v3"/><path d="M5 10a8 8 0 0 1 14 0"/><rect x="4" y="10" width="16" height="9" rx="2"/></svg></button>
  <button id="fullBtn" title="フルスクリーン" aria-label="フルスクリーン"><svg viewBox="0 0 24 24"><path d="M4 9V4h5"/><path d="M20 9V4h-5"/><path d="M4 15v5h5"/><path d="M20 15v5h-5"/></svg></button>
</div>

<div class="sheet">
  <div class="info"><h2 id="infoTitle"></h2><p id="infoText"></p></div>
  <div class="chips" id="parts"></div>
</div>

<div id="loading"><div class="spin"></div></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const PARTS = [
  { id:'assembly', label:'ドッキング状態', files:[
      { url:'models/dock.stl', color:0x4a90b8 },
      { url:'models/pendant_dummy_docked.stl', color:0x2a2e35 } ],
    note:'ペンダントを90°回して上から差し込んだ状態。黒=ペンダント（ダミー形状）。左にタワーと吊り輪が出て紐が逃げ、竜頭は上向き。下のサドルに純正充電パックが入る。' },
  { id:'dock', label:'ドック', files:[ { url:'models/dock.stl', color:0x4a90b8 } ],
    note:'ドック本体（PLA, 124×92×80mm）。中央下のサドルに純正パック 41×27×9.6mm を収める。左側は紐の通り道で開放。' },
  { id:'shell', label:'シェル v4', files:[ { url:'models/pendant_shell_v4.stl', color:0x9aa1a9 } ],
    note:'ペンダントシェル v4（PLA）。左側（充電接点側）を弦カットで開口し、本体側面が3.1mm突き出す。上部タワーにチェーン穴φ5。' },
  { id:'liner', label:'ライナー', files:[ { url:'models/pendant_liner_v3.stl', color:0xe3ddcb } ],
    note:'TPUライナー v3。本体に直接触れる層。背面センサー窓φ29。' },
  { id:'bail', label:'ベイル（吊り輪）', files:[ { url:'models/pendant_bail_v3.stl', color:0xe3ddcb } ],
    note:'TPUベイル v3。紐を通す吊り輪（穴φ9）。紐は使用者側で用意。' },
  { id:'module', label:'サイドモジュール', files:[ { url:'models/pendant_side_module_v3.stl', color:0xe3ddcb } ],
    note:'TPUサイドモジュール v3。竜頭とサイドボタンを押せるプランジャ付き。' },
  { id:'pucktest', label:'パック fit テスト', files:[ { url:'models/puck_fit_test.stl', color:0x4a90b8 } ],
    note:'純正パックのポケットだけのフィット確認ピース。本印刷の前にこれで確認する。' },
];

const container = document.getElementById('view');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0e13);
scene.fog = new THREE.Fog(0x0b0e13, 700, 1600);
const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 5000);
camera.up.set(0, 0, 1); // models are Z-up
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
container.appendChild(renderer.domElement);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.autoRotateSpeed = 2.2;
controls.minDistance = 40; controls.maxDistance = 900;

const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(120, -140, 220); scene.add(key);
const rim = new THREE.DirectionalLight(0x7ee0c2, 0.9); rim.position.set(-160, 120, -80); scene.add(rim);
scene.add(new THREE.AmbientLight(0xffffff, 0.25));

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(600, 64),
  new THREE.ShadowMaterial({ opacity: 0.0 })
);
scene.add(ground);
const grid = new THREE.GridHelper(480, 48, 0x2b3644, 0x1a222d);
grid.rotation.x = Math.PI / 2; grid.position.z = -0.01;
grid.material.transparent = true; grid.material.opacity = 0.55;
scene.add(grid);

const loader = new STLLoader();
let group = null, spin = false, wire = false, currentBox = null;

function resize(){
  const w = container.clientWidth, h = container.clientHeight;
  camera.aspect = w / h; camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
}
addEventListener('resize', resize);

function frame(objects){
  const box = new THREE.Box3();
  objects.forEach(o => box.expandByObject(o));
  currentBox = box;
  const c = box.getCenter(new THREE.Vector3());
  const s = box.getSize(new THREE.Vector3()).length();
  controls.target.copy(c);
  const fitF = camera.aspect < 1 ? Math.min(2.4, 0.82 / camera.aspect) : 1;
  camera.position.set(c.x + s * 0.5 * fitF, c.y - s * 0.72 * fitF, c.z + s * 0.42 * fitF);
  camera.near = s / 100; camera.far = s * 30; camera.updateProjectionMatrix();
  grid.position.z = box.min.z - 0.02;
}

async function load(part){
  const loading = document.getElementById('loading');
  loading.classList.remove('hide');
  if (group){ scene.remove(group); group.traverse(o => { if (o.geometry) o.geometry.dispose(); }); }
  group = new THREE.Group();
  const loaded = [];
  try {
    for (const f of part.files){
      const geo = await loader.loadAsync(f.url);
      geo.computeVertexNormals();
      const mat = new THREE.MeshStandardMaterial({ color:f.color, roughness:0.42, metalness:0.08, wireframe:wire });
      const mesh = new THREE.Mesh(geo, mat);
      group.add(mesh); loaded.push(mesh);
    }
  } catch(e) {
    document.getElementById('infoText').textContent = '読み込みに失敗しました。通信環境を確認して再読み込みしてください。';
  }
  scene.add(group);
  if (loaded.length) frame(loaded);
  document.getElementById('infoTitle').textContent = part.label;
  document.getElementById('infoText').textContent = part.note;
  document.querySelectorAll('#parts button').forEach(b => b.classList.toggle('active', b.dataset.id === part.id));
  loading.classList.add('hide');
}

const partsDiv = document.getElementById('parts');
PARTS.forEach(p => {
  const b = document.createElement('button');
  b.textContent = p.label; b.dataset.id = p.id;
  b.onclick = () => { load(p); b.scrollIntoView({ behavior:'smooth', inline:'center', block:'nearest' }); };
  partsDiv.appendChild(b);
});

const spinBtn = document.getElementById('spinBtn');
spinBtn.onclick = () => { spin = !spin; controls.autoRotate = spin; spinBtn.classList.toggle('active', spin); };
const wireBtn = document.getElementById('wireBtn');
wireBtn.onclick = () => { wire = !wire; if (group) group.traverse(o => { if (o.material) o.material.wireframe = wire; }); wireBtn.classList.toggle('active', wire); };
function lookFrom(dir){
  if (!currentBox) return;
  const c = currentBox.getCenter(new THREE.Vector3());
  const s = currentBox.getSize(new THREE.Vector3()).length();
  const fitF2 = camera.aspect < 1 ? Math.min(2.4, 0.82 / camera.aspect) : 1;
  camera.position.copy(c).addScaledVector(dir, s * 1.05 * fitF2);
  controls.target.copy(c);
}
document.getElementById('frontBtn').onclick = () => lookFrom(new THREE.Vector3(0, -1, 0.12));
document.getElementById('topBtn').onclick = () => lookFrom(new THREE.Vector3(0, -0.12, 1));
document.getElementById('fullBtn').onclick = () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen?.();
};

resize();
load(PARTS[0]);
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
</body>
</html>
